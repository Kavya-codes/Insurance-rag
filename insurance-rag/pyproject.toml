[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insurance-rag"
version = "0.1.0"
description = "Grounded Retrieval-Augmented Generation system for Indian insurance regulations, policy wordings, and PM-JAY guidelines."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
  "pydantic>=2.9.0",
  "python-dotenv>=1.0.1",
  "google-genai>=1.0.0",
  "pypdf>=5.0.0",
  "rank-bm25>=0.2.2",
  "sentence-transformers>=3.0.0",
  "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.27.0",
]

[project.scripts]
insurance-rag = "insurance_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
insurance_rag = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"
